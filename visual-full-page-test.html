<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ApplyPilot visual full-page fixture</title>
  <style>
    body { max-width: 900px; margin: auto; padding: 30px; font: 16px/1.5 system-ui; }
    section { min-height: 720px; border-bottom: 1px solid #ddd; padding: 20px 0; }
    label { display: block; margin: 18px 0; }
    input, select, textarea { display: block; width: 80%; padding: 10px; }
  </style>
</head>
<body>
  <h1>Visual autofill full-page fixture</h1>
  <section>
    <h2>基本信息</h2>
    <label>姓名<input name="opaque_1"></label>
    <label>邮箱<input name="opaque_2"></label>
    <label>手机号码<input name="opaque_3"></label>
  </section>
  <section>
    <h2>教育经历</h2>
    <label>起止时间<input name="opaque_4"> <input name="opaque_5"></label>
    <label>学历类型<select name="opaque_6"><option>请选择</option><option>统招全日制</option></select></label>
    <label>学校名称<input name="opaque_7"></label>
    <label>学历<select name="opaque_8"><option>请选择</option><option>硕士研究生</option></select></label>
    <label>学院<input name="opaque_9"></label>
    <label>专业<input name="opaque_10"></label>
    <label>实验室<input name="opaque_11"></label>
    <label>领域方向<input name="opaque_12"></label>
    <label>导师<input name="opaque_13"></label>
  </section>
  <section>
    <h2>工作经历</h2>
    <label>开始时间<input name="opaque_14"></label>
    <label>结束时间<input name="opaque_15"></label>
    <label>企业名称<input name="opaque_16"></label>
    <label>职位名称<input name="opaque_17"></label>
    <label>工作描述<textarea name="opaque_18"></textarea></label>
  </section>
</body>
</html>
